name: Grill CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    container:
      image: frotty/wurstscript
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install project dependencies
        run: grill install

      - name: Run protocol unit tests
        run: grill test

  canary-map:
    runs-on: ubuntu-latest
    container:
      image: frotty/wurstscript
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install canary dependencies (pulls this repo from GitHub)
        working-directory: canary
        run: grill install

      # The canary's stdlib-ingame and bench-unit-index suites need KeyedMap and the
      # in-game suite callback from wurstscript/WurstStdlib2#480. Until that merges,
      # move the stdlib dependency onto that branch. Remove this step afterwards.
      - name: Use the stdlib branch with KeyedMap (WurstStdlib2#480)
        uses: actions/checkout@v4
        with:
          repository: wurstscript/WurstStdlib2
          ref: unitindexer-keyed-map
          path: canary/_build/dependencies/wurstStdlib2

      - name: Build canary map
        working-directory: canary
        run: grill build ExampleMap.w3x
